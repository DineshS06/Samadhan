<!-- Samadhan vector badge — NOT the browser tab icon any more.

     The tab icon is now public/Samadhan.png, the real brand artwork, per the
     icon links in index.html. This file is deliberately kept on disk because
     scripts/audit/verifiers.mjs (SEO-013) requires it to exist, and old cached
     tabs may still request it, but it is unlinked and no longer influences
     what a browser tab displays.

     History: this file previously contained a purple-blue lightning bolt, a
     tech-stack mark, not ours. It was replaced by this hand-drawn vector (open
     navy ring + orange pin, colors sampled from src/assets/logo.png), which
     served as the tab icon until that rendition proved unrecognisable too. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Samadhan badge">
  <!-- white plate so the mark stays legible on dark browser tabs -->
  <circle cx="32" cy="32" r="31" fill="#FFFFFF"/>
  <!-- open badge ring; the gap sits north-east, where the logo's arrow exits -->
  <path d="M40.55 8.51A25 25 0 1 0 55.49 23.45" fill="none" stroke="#0C246C" stroke-width="7" stroke-linecap="round"/>
  <!-- location pin, the core mark -->
  <path d="M22 26a10 10 0 0 1 20 0c0 7-3.1 11.6-10 20-6.9-8.4-10-13-10-20Z" fill="#FC840C"/>
  <circle cx="32" cy="26" r="4" fill="#FFFFFF"/>
</svg>
