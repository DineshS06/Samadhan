      <h1>Samadhan: report a constituency issue and get it ranked</h1>
      <p>
        Samadhan turns citizen grievances into ranked constituency projects. You
        report the problem in your own language, attach a location and evidence,
        and receive a reference ID to track it. Your name and phone number stay
        private. Every project is scored on published, checkable criteria.
      </p>

      <h2>What people report, and what we do about it</h2>
      <p>
        The categories below are the ones citizens most often raise on India's
        central public grievance portal: PM-KISAN instalments, the rural
        employment guarantee, ration distribution, and health cover. Samadhan
        groups a report by category so that one person's problem becomes a
        visible pattern across a constituency instead of an isolated complaint.
      </p>

      <h2>What to do when a payment or service has not arrived</h2>
      <p>
        Most complaints about central schemes fall into a small number of
        published causes. These are the ones DARPG reports under, and each has a
        specific fix.
      </p>
      <h3>Categories DARPG reports the most grievances under</h3>
      <ul>
          <li>PMKISAN related issues</li>
          <li>Pradhan Mantri Awaas Yojana, Gramin (Rural)</li>
          <li>Swachh Bharat Mission, Rural</li>
          <li>Housing and Urban Development Corporation</li>
        </ul>

      <h2>How a reported issue is ranked</h2>
      <p>
        Samadhan scores each verified grievance on three published components:
        confirmed demand at 40 percent, measured infrastructure deficit at 40
        percent, and severity at 20 percent. Every component is auditable, so
        any ranking decision can be checked and challenged. No black box decides
        what matters in your constituency.
      </p>
      <p>
        <a href="/methodology">Read the full scoring methodology</a>, or
        <a href="/how-it-works">see the six-step workflow</a> from report to ranked
        project.
      </p>

      <h2>Report a problem in your constituency</h2>
      <p>
        You can report a problem in any language. Attach a location and any
        evidence you have, and you will get a reference ID to track the report.
        Contact details are stored separately from the public record.
      </p>
      <p><a href="/report-issue">Report a constituency issue</a></p>

      <h2>Common questions</h2>
      <h3>Why has my scheme payment not been credited?</h3>
      <p>
        Published reporting identifies a small set of recurring causes: an
        incomplete e-KYC, an Aadhaar number not linked to the bank account, a
        name mismatch between Aadhaar and the bank record, land bought or
        inherited after 1 February 2019, and more than one claimant in the same
        family. Check your status on the official portal first, then report it
        here so the pattern is visible for your constituency.
      </p>
      <h3>How is an issue prioritised over another?</h3>
      <p>
        By the published 40-40-20 score, not by who asked loudest. Demand and
        infrastructure deficit each carry 40 percent, severity carries 20, and
        the components are published so any decision can be reviewed.
      </p>
      <h3>Who can see what I report?</h3>
      <p>
        The substance of a report is public so it can be counted. Your name,
        phone number and contact details are stored separately and are not shown
        on the public record. <a href="/privacy">Read the privacy policy</a>.
      </p>
      <p><a href="/faq">All frequently asked questions</a></p>
